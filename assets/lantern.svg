<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" width="60" height="100">
  <style>
    .glow { animation: flicker 4s ease-in-out infinite; }
    .glow2 { animation: flicker2 4s ease-in-out infinite 0.5s; }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      25%       { opacity: 0.85; }
      50%       { opacity: 0.95; }
      75%       { opacity: 0.8; }
    }
    @keyframes flicker2 {
      0%, 100% { opacity: 0.3; r: 18; }
      40%      { opacity: 0.18; r: 14; }
      70%      { opacity: 0.28; r: 16; }
    }
  </style>
  <!-- Chain/rope -->
  <rect x="28" y="0" width="4" height="12" fill="#432C20"/>
  <rect x="26" y="6" width="8" height="2" fill="#432C20"/>
  <!-- Lantern top cap -->
  <rect x="18" y="12" width="24" height="6" rx="2" fill="#432C20"/>
  <!-- Lantern body frame -->
  <rect x="14" y="18" width="32" height="50" rx="3" fill="#432C20"/>
  <!-- Lantern glass panels -->
  <rect x="17" y="21" width="12" height="44" rx="1" fill="#2B1B14" opacity="0.6"/>
  <rect x="31" y="21" width="12" height="44" rx="1" fill="#2B1B14" opacity="0.6"/>
  <!-- Inner glow -->
  <rect x="19" y="23" width="22" height="40" rx="1" fill="#D99A4E" class="glow"/>
  <circle cx="30" cy="43" r="18" fill="#F3E4C8" opacity="0.2" class="glow2"/>
  <!-- Center flame pixel -->
  <rect x="27" y="37" width="6" height="8" fill="#F3E4C8" class="glow"/>
  <rect x="29" y="35" width="2" height="4" fill="#ffffff" class="glow"/>
  <!-- Bottom cap -->
  <rect x="18" y="68" width="24" height="6" rx="2" fill="#432C20"/>
  <!-- Bottom hook -->
  <rect x="26" y="74" width="8" height="4" fill="#432C20"/>
  <rect x="28" y="78" width="4" height="6" fill="#432C20"/>
</svg>
