<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 60" width="80" height="60">
  <style>
    .eye { animation: blink 5s ease-in-out infinite; }
    .tail { animation: wag 3s ease-in-out infinite; transform-origin: 20px 48px; }
    @keyframes blink {
      0%, 90%, 100%  { transform: scaleY(1); }
      95%            { transform: scaleY(0.1); }
    }
    @keyframes wag {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(8deg); }
      75%      { transform: rotate(-8deg); }
    }
  </style>
  <!-- Tail -->
  <path class="tail" d="M 20 48 Q 5 50 8 40 Q 10 32 18 36" stroke="#D99A4E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="22" y="32" width="36" height="24" rx="6" fill="#D99A4E"/>
  <!-- Head -->
  <rect x="26" y="14" width="28" height="24" rx="8" fill="#D99A4E"/>
  <!-- Ears -->
  <polygon points="28,18 24,6 34,14" fill="#D99A4E"/>
  <polygon points="52,18 56,6 46,14" fill="#D99A4E"/>
  <!-- Inner ear -->
  <polygon points="29,16 26,9 33,14" fill="#B8895A" opacity="0.6"/>
  <polygon points="51,16 54,9 47,14" fill="#B8895A" opacity="0.6"/>
  <!-- Face -->
  <!-- Eyes -->
  <rect x="31" y="22" width="6" height="6" rx="3" fill="#432C20" class="eye"/>
  <rect x="43" y="22" width="6" height="6" rx="3" fill="#432C20" class="eye"/>
  <!-- Eye shine -->
  <rect x="33" y="23" width="2" height="2" fill="white" class="eye"/>
  <rect x="45" y="23" width="2" height="2" fill="white" class="eye"/>
  <!-- Nose -->
  <rect x="38" y="29" width="4" height="3" rx="1" fill="#B8895A"/>
  <!-- Mouth -->
  <path d="M37 33 Q40 36 43 33" stroke="#432C20" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="22" y1="30" x2="36" y2="31" stroke="#432C20" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="33" x2="36" y2="33" stroke="#432C20" stroke-width="1" opacity="0.6"/>
  <line x1="44" y1="31" x2="58" y2="30" stroke="#432C20" stroke-width="1" opacity="0.6"/>
  <line x1="44" y1="33" x2="58" y2="33" stroke="#432C20" stroke-width="1" opacity="0.6"/>
  <!-- Paws -->
  <rect x="24" y="52" width="12" height="8" rx="4" fill="#D99A4E"/>
  <rect x="44" y="52" width="12" height="8" rx="4" fill="#D99A4E"/>
  <!-- Stripe markings -->
  <line x1="30" y1="36" x2="30" y2="50" stroke="#B8895A" stroke-width="2" opacity="0.4"/>
  <line x1="40" y1="36" x2="40" y2="50" stroke="#B8895A" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="36" x2="50" y2="50" stroke="#B8895A" stroke-width="2" opacity="0.4"/>
</svg>
