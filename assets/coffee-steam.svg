<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <style>
    .steam { opacity: 0; fill: none; stroke: #D99A4E; stroke-width: 2; stroke-linecap: round; }
    .s1 { animation: rise1 3s ease-in-out infinite; }
    .s2 { animation: rise2 3s ease-in-out infinite 0.8s; }
    .s3 { animation: rise3 3s ease-in-out infinite 1.6s; }
    @keyframes rise1 {
      0%   { opacity: 0; transform: translateY(0) scaleX(1); }
      30%  { opacity: 0.7; }
      70%  { opacity: 0.3; transform: translateY(-22px) scaleX(1.3); }
      100% { opacity: 0; transform: translateY(-35px) scaleX(0.8); }
    }
    @keyframes rise2 {
      0%   { opacity: 0; transform: translateY(0) scaleX(1); }
      30%  { opacity: 0.6; }
      70%  { opacity: 0.25; transform: translateY(-20px) scaleX(0.9); }
      100% { opacity: 0; transform: translateY(-32px) scaleX(1.2); }
    }
    @keyframes rise3 {
      0%   { opacity: 0; transform: translateY(0) scaleX(1); }
      30%  { opacity: 0.5; }
      70%  { opacity: 0.2; transform: translateY(-18px) scaleX(1.1); }
      100% { opacity: 0; transform: translateY(-28px) scaleX(0.9); }
    }
  </style>
  <!-- Coffee cup (pixel-art style) -->
  <rect x="40" y="48" width="40" height="26" rx="2" fill="#432C20"/>
  <rect x="42" y="50" width="36" height="22" rx="1" fill="#795334"/>
  <rect x="44" y="52" width="32" height="8" fill="#B8895A" opacity="0.4"/>
  <!-- Cup handle -->
  <rect x="80" y="56" width="6" height="2" fill="#432C20"/>
  <rect x="84" y="56" width="2" height="10" fill="#432C20"/>
  <rect x="80" y="64" width="6" height="2" fill="#432C20"/>
  <!-- Saucer -->
  <rect x="34" y="74" width="52" height="4" rx="2" fill="#432C20"/>
  <!-- Steam wisps -->
  <path class="steam s1" d="M52 48 Q49 38 53 30 Q56 22 52 14"/>
  <path class="steam s2" d="M60 48 Q57 37 61 28 Q65 20 61 12"/>
  <path class="steam s3" d="M68 48 Q71 37 67 28 Q64 20 68 12"/>
</svg>
