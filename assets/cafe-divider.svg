<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 50" width="900" height="50">
  <style>
    .leaf1 { animation: sway1 4s ease-in-out infinite; transform-origin: 60px 10px; }
    .leaf2 { animation: sway2 5s ease-in-out infinite 0.5s; transform-origin: 450px 10px; }
    .leaf3 { animation: sway1 4.5s ease-in-out infinite 1s; transform-origin: 840px 10px; }
    @keyframes sway1 {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(5deg); }
    }
    @keyframes sway2 {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-5deg); }
    }
  </style>
  <!-- Left section: vine + lantern -->
  <rect x="0" y="20" width="180" height="4" rx="2" fill="#795334"/>
  <!-- Vine leaves left -->
  <ellipse cx="40" cy="15" rx="8" ry="5" fill="#667A50" class="leaf1"/>
  <ellipse cx="70" cy="18" rx="6" ry="4" fill="#667A50" class="leaf1"/>
  <ellipse cx="100" cy="13" rx="7" ry="4" fill="#667A50" class="leaf1"/>
  <ellipse cx="130" cy="17" rx="6" ry="4" fill="#667A50" class="leaf1"/>
  <ellipse cx="160" cy="14" rx="8" ry="5" fill="#667A50" class="leaf1"/>

  <!-- Center icon group -->
  <!-- Left coffee cup -->
  <rect x="195" y="14" width="22" height="16" rx="2" fill="#432C20"/>
  <rect x="197" y="16" width="18" height="12" rx="1" fill="#795334"/>
  <rect x="217" y="18" width="4" height="8" rx="2" fill="#432C20"/>
  <!-- Steam above cup -->
  <path d="M202 14 Q200 8 203 4" stroke="#D99A4E" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="d" values="M202 14 Q200 8 203 4;M202 14 Q204 8 201 4;M202 14 Q200 8 203 4" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M208 14 Q210 7 207 3" stroke="#D99A4E" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- Center text decoration -->
  <text x="240" y="28" font-family="monospace" font-size="14" fill="#D99A4E" font-weight="bold">☕</text>
  <!-- Autumn leaf -->
  <text x="265" y="28" font-family="monospace" font-size="14" fill="#B8895A">🍂</text>
  <text x="290" y="28" font-family="monospace" font-size="14" fill="#D99A4E" font-weight="bold">☕</text>

  <!-- Small pixel decorative dots -->
  <rect x="320" y="22" width="4" height="4" fill="#795334" opacity="0.5"/>
  <rect x="332" y="20" width="4" height="4" fill="#B8895A" opacity="0.5"/>
  <rect x="344" y="23" width="4" height="4" fill="#795334" opacity="0.5"/>

  <!-- Lantern center hanging -->
  <rect x="360" y="0" width="4" height="10" fill="#432C20"/>
  <rect x="354" y="10" width="16" height="30" rx="3" fill="#432C20"/>
  <rect x="357" y="13" width="10" height="24" rx="1" fill="#D99A4E" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Right decorative dots -->
  <rect x="380" y="22" width="4" height="4" fill="#795334" opacity="0.5"/>
  <rect x="392" y="20" width="4" height="4" fill="#B8895A" opacity="0.5"/>
  <rect x="404" y="23" width="4" height="4" fill="#795334" opacity="0.5"/>

  <!-- Second coffee -->
  <text x="416" y="28" font-family="monospace" font-size="14" fill="#D99A4E" font-weight="bold">☕</text>
  <text x="441" y="28" font-family="monospace" font-size="14" fill="#B8895A">🍂</text>
  <text x="466" y="28" font-family="monospace" font-size="14" fill="#D99A4E" font-weight="bold">☕</text>

  <!-- Second lantern -->
  <rect x="496" y="0" width="4" height="10" fill="#432C20"/>
  <rect x="490" y="10" width="16" height="30" rx="3" fill="#432C20"/>
  <rect x="493" y="13" width="10" height="24" rx="1" fill="#D99A4E" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- More dots -->
  <rect x="514" y="22" width="4" height="4" fill="#795334" opacity="0.5"/>
  <rect x="526" y="20" width="4" height="4" fill="#B8895A" opacity="0.5"/>

  <!-- Third coffee group -->
  <text x="538" y="28" font-family="monospace" font-size="14" fill="#D99A4E" font-weight="bold">☕</text>
  <text x="563" y="28" font-family="monospace" font-size="14" fill="#B8895A">🍂</text>
  <text x="588" y="28" font-family="monospace" font-size="14" fill="#D99A4E" font-weight="bold">☕</text>

  <!-- Second small lantern -->
  <rect x="622" y="0" width="4" height="10" fill="#432C20"/>
  <rect x="616" y="10" width="16" height="30" rx="3" fill="#432C20"/>
  <rect x="619" y="13" width="10" height="24" rx="1" fill="#D99A4E" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.7;0.9" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Right vine beam -->
  <rect x="720" y="20" width="180" height="4" rx="2" fill="#795334"/>
  <!-- Vine leaves right -->
  <ellipse cx="740" cy="15" rx="8" ry="5" fill="#667A50" class="leaf3"/>
  <ellipse cx="770" cy="18" rx="6" ry="4" fill="#667A50" class="leaf3"/>
  <ellipse cx="800" cy="13" rx="7" ry="4" fill="#667A50" class="leaf3"/>
  <ellipse cx="830" cy="17" rx="6" ry="4" fill="#667A50" class="leaf3"/>
  <ellipse cx="860" cy="14" width="8" ry="5" fill="#667A50" class="leaf3"/>
</svg>
