<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <style>
    @keyframes flutter {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(200px, -20px) rotate(15deg); opacity: 1; }
      90%  { opacity: 0.8; }
      100% { transform: translate(850px, 30px) rotate(-10deg); opacity: 0; }
    }
    @keyframes flutter2 {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      50%  { transform: translate(-180px, 15px) rotate(-12deg); opacity: 1; }
      90%  { opacity: 0.8; }
      100% { transform: translate(-850px, -20px) rotate(8deg); opacity: 0; }
    }
    .butterfly { animation: flutter 18s ease-in-out infinite; }
    .butterfly2 { animation: flutter2 24s ease-in-out infinite 8s; }
    /* Wing flap */
    @keyframes wingflap {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(0.3); }
    }
    .wing-top    { animation: wingflap 0.3s ease-in-out infinite; transform-origin: 0 50%; }
    .wing-bottom { animation: wingflap 0.3s ease-in-out infinite 0.15s; transform-origin: 0 50%; }
  </style>

  <!-- Butterfly 1 - starts from left -->
  <g class="butterfly" transform="translate(0, 60)">
    <!-- Wings -->
    <ellipse class="wing-top"    cx="-12" cy="-8"  rx="14" ry="9"  fill="#667A50" opacity="0.8"/>
    <ellipse class="wing-top"    cx="12"  cy="-8"  rx="14" ry="9"  fill="#667A50" opacity="0.8"/>
    <ellipse class="wing-bottom" cx="-10" cy="8"   rx="10" ry="7"  fill="#B8895A" opacity="0.7"/>
    <ellipse class="wing-bottom" cx="10"  cy="8"   rx="10" ry="7"  fill="#B8895A" opacity="0.7"/>
    <!-- Wing spots -->
    <ellipse cx="-10" cy="-7" rx="4" ry="3" fill="#D99A4E" opacity="0.5"/>
    <ellipse cx="10"  cy="-7" rx="4" ry="3" fill="#D99A4E" opacity="0.5"/>
    <!-- Body -->
    <rect x="-2" y="-12" width="4" height="24" rx="2" fill="#432C20"/>
    <!-- Antennae -->
    <path d="M-1 -12 Q-8 -22 -5 -28" stroke="#432C20" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M1 -12 Q8 -22 5 -28" stroke="#432C20" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-5" cy="-28" r="2" fill="#432C20"/>
    <circle cx="5"  cy="-28" r="2" fill="#432C20"/>
  </g>

  <!-- Butterfly 2 - starts from right -->
  <g class="butterfly2" transform="translate(900, 40)">
    <ellipse class="wing-top"    cx="-10" cy="-7"  rx="12" ry="8"  fill="#B8895A" opacity="0.8"/>
    <ellipse class="wing-top"    cx="10"  cy="-7"  rx="12" ry="8"  fill="#B8895A" opacity="0.8"/>
    <ellipse class="wing-bottom" cx="-8"  cy="7"   rx="8"  ry="6"  fill="#667A50" opacity="0.7"/>
    <ellipse class="wing-bottom" cx="8"   cy="7"   rx="8"  ry="6"  fill="#667A50" opacity="0.7"/>
    <ellipse cx="-8" cy="-6" rx="3" ry="2" fill="#D99A4E" opacity="0.5"/>
    <ellipse cx="8"  cy="-6" rx="3" ry="2" fill="#D99A4E" opacity="0.5"/>
    <rect x="-2" y="-10" width="4" height="20" rx="2" fill="#432C20"/>
    <path d="M-1 -10 Q-7 -19 -4 -24" stroke="#432C20" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M1 -10 Q7 -19 4 -24" stroke="#432C20" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-4" cy="-24" r="2" fill="#432C20"/>
    <circle cx="4"  cy="-24" r="2" fill="#432C20"/>
  </g>
</svg>
